      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "FmHQz8ff9bG9mRTB7iSksZFj8y4vt0-GMC_HTNaDdlBmdXl3JHTr2EqVI1xtjmPg1gorLC3uPKMDEd6DHf3F6g"
