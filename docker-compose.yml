  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  media_data:
  backups:
  db_backups:
  staticfiles:

networks:
  app_network:
    driver: bridge
