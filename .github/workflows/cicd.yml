name: CI/CD Optimized Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🔐 Load .env file
      run: |
        cp ./safarname24/.env .env || echo "⚠️ .env file not found, skipping..."

    - name: 🛠 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🐳 Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: 💾 Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: 🏗 Build Docker images with cache
      run: docker-compose build --build-arg CACHEBUST=$(date +%s)

    - name: 💻 Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 🧰 Install Python dependencies
      run: docker-compose run --rm web pip install --no-cache-dir -r /app/requirements.txt

    - name: 🔃 Run Django migrations
      run: docker-compose run --rm web python manage.py migrate

    - name: 🎨 Collect static files
      run: docker-compose run --rm web python manage.py collectstatic --noinput

    - name: ✅ Run Django tests
      run: docker-compose run --rm web python manage.py test

    - name: 🤖 Test Telegram bot backup
      run: docker-compose run --rm bot bash -c "echo 'Testing backup.sh'; bash /app/backup.sh || echo 'Backup failed, check logs'"

    - name: 🔐 Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      env:
        SERVER_IP: 91.107.133.7

    - name: 🚀 Deploy to server
      run: |
        ssh root@$SERVER_IP << 'EOF'
          cd /var/hotelscript-v2
          git pull origin master
          docker-compose up -d --build
          docker-compose restart bot
        EOF
      env:
        SERVER_IP: 91.107.133.7
