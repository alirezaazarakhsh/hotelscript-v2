name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_NAME: mydatabase
      DB_USER: myuser
      DB_PASSWORD: mypassword

    services:
      db:
        image: postgres:13
        ports:
          - 5432:5432  
        env:
          POSTGRES_DB: $DB_NAME
          POSTGRES_USER: $DB_USER
          POSTGRES_PASSWORD: $DB_PASSWORD

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Install Docker Compose
      run: sudo apt-get update && sudo apt-get install -y docker-compose-plugin

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker-compose -f docker-compose.yml --env-file .env build

    - name: Install dependencies
      run: |
        docker-compose -f docker-compose.yml --env-file .env run web pip install --no-cache-dir -r /app/requirements.txt

    - name: Run Django migrations
      run: |
        docker-compose -f docker-compose.yml --env-file .env run web python manage.py migrate

    - name: Run Django tests
      run: |
        docker-compose -f docker-compose.yml --env-file .env run web python manage.py test

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
      env:
        SERVER_IP: 91.107.134.107

    - name: Deploy to server
      run: |
        ssh root@$SERVER_IP << 'EOF'
          cd /var/hotelscript-v2 || exit
          git rev-parse --is-inside-work-tree || exit
          git pull origin master
          docker-compose down
          docker-compose up -d --build
        EOF
      env:
        SERVER_IP: 91.107.134.107
