name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:13
        ports:
          - 5432:5432  
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Load .env file
      run: |
        echo "Loading .env file"
        cp ./safarname24/.env .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker-compose -f docker-compose.yml build

    - name: Install dependencies
      run: |
        docker-compose -f docker-compose.yml run web pip install --no-cache-dir -r /app/requirements.txt

    - name: Run Django migrations
      run: |
        docker-compose -f docker-compose.yml run web python manage.py migrate

    - name: Run Django tests
      run: |
        docker-compose -f docker-compose.yml run web python manage.py test

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh root@${{ secrets.SERVER_IP }} << 'EOF'
          cd /var/hotelscript-v2
          git pull origin main
          docker-compose down
          docker-compose up -d --build
        EOF
