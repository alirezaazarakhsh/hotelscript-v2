services:
  web:
    build: .
    container_name: zarvantrip_django_app
    restart: unless-stopped
    command: bash /app/start.sh
    volumes:
      - /var/hotelscript-v2-new/media:/app/media
      - /var/hotelscript-v2-new/staticfiles:/app/staticfiles
      - /var/backups/zarvantrip:/var/backups/zarvantrip
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "zarvantrip"
      DB_USER: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/zarvantrip"
      ALLOWED_HOSTS: "localhost,127.0.0.1,zarvantrip.com,www.zarvantrip.com,cps.zarvantrip.com,www.cps.zarvantrip.com,chatbot.zarvantrip.com,www.chatbot.zarvantrip.com,37.152.181.133"
      CSRF_TRUSTED_ORIGINS: "http://zarvantrip.com,https://zarvantrip.com,http://www.zarvantrip.com,https://www.zarvantrip.com,http://cps.zarvantrip.com,https://cps.zarvantrip.com,http://chatbot.zarvantrip.com,https://chatbot.zarvantrip.com,http://www.chatbot.zarvantrip.com,https://www.chatbot.zarvantrip.com,http://37.152.181.133,http://37.152.181.133:8000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  channels_worker:
    build: .
    container_name: zarvantrip_channels_worker
    restart: unless-stopped
    command: python manage.py runworker default
    volumes:
      - /var/hotelscript-v2-new/media:/app/media
      - /var/backups/zarvantrip:/var/backups/zarvantrip
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "zarvantrip"
      DB_USER: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/zarvantrip"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  celery:
    build: .
    container_name: zarvantrip_celery_worker
    restart: unless-stopped
    command: celery -A zarvantrip worker -l info --max-tasks-per-child=100 --max-memory-per-child=400000
    volumes:
      - /var/hotelscript-v2-new/media:/app/media
      - /var/backups/zarvantrip:/var/backups/zarvantrip
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "zarvantrip"
      DB_USER: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/zarvantrip"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  celery_beat:
    build: .
    container_name: zarvantrip_celery_beat
    restart: unless-stopped
    command: celery -A zarvantrip beat -l info
    volumes:
      - /var/hotelscript-v2-new/media:/app/media
      - /var/backups/zarvantrip:/var/backups/zarvantrip
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "zarvantrip"
      DB_USER: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/zarvantrip"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
      - celery
    networks:
      - app_network

  db:
    image: postgres:15.2
    container_name: zarvantrip_postgres_db
    restart: unless-stopped
    oom_score_adj: -1000
    command: >
      postgres
      -c shared_buffers=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=4096MB
      -c max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "zarvantrip"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: zarvantrip_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge