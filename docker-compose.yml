  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "alirezaazarakhsh20@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    volumes:
      - /var/lib/backsafarname:/var/lib/pgadmin/storage
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  postgres_data:
  media_storage:

networks:
  app_network:
