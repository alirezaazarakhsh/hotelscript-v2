name: CI/CD Backend Deploy - Hotel Script V1 Z

on:
  push:
    branches:
      - hotel-scriptv1-z

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Second Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_HOTEL_SCRIPTV1_Z }}
          SERVER_IP: ${{ secrets.SERVER_IP_HOTEL_SCRIPTV1_Z }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p 2394 -H "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Second Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_HOTEL_SCRIPTV1_Z }}
          SERVER_USER: ${{ secrets.SERVER_USER_HOTEL_SCRIPTV1_Z }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_rsa \
            -p 2394 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_IP" << 'EOF'

              set -euo pipefail

              echo "Starting deployment..."
              cd /var/hotelscript-v2

              echo "Fetching branch..."
              git fetch origin hotel-scriptv1-z

              echo "Checking out deployment branch..."
              git checkout hotel-scriptv1-z

              echo "Updating code..."
              git pull --ff-only origin hotel-scriptv1-z

              echo "Rebuilding and starting containers..."
              docker compose up -d --build

              echo "Container status:"
              docker compose ps

              echo "Deployment completed successfully at $(date)"

          EOF

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_rsa
