name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15.2
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v2

    - name: 🔐 Load .env file
      run: |
        echo "Loading .env file"
        cp ./safarname24/.env .env || echo "⚠️ .env file not found, skipping..."

    - name: 🛠 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🧰 Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: 💾 Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: 🏗 Build Docker image
      run: |
        docker-compose -f docker-compose.yml build

    - name: 📦 Install Python dependencies
      run: |
        docker-compose -f docker-compose.yml run --rm web pip install --no-cache-dir -r /app/requirements.txt

    - name: 🔃 Run Django migrations
      run: |
        docker-compose -f docker-compose.yml run --rm web python manage.py migrate

    - name: 🎨 Collect static files
      run: |
        docker-compose -f docker-compose.yml run --rm web python manage.py collectstatic --noinput

    - name: ✅ Run Django tests
      run: |
        docker-compose -f docker-compose.yml run --rm web python manage.py test

    # Optional: Clean up Docker containers and volumes after tests
    - name: 🧹 Clean up (optional)
      if: always()
      run: |
        docker-compose down -v

    - name: 🔐 Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      env:
        SERVER_IP: 91.107.172.215

    - name: 🚀 Deploy to server
      run: |
        ssh root@$SERVER_IP << 'EOF'
          cd /var/hotelscript-v2
          git pull origin master
          docker-compose down
          docker-compose up -d --build
        EOF
      env:
        SERVER_IP: 91.107.172.215
