name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:13
        ports:
          - 5432:5432  

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker image
      run: |
        docker-compose -f docker-compose.yml build

    - name: Install dependencies
      run: |
        docker-compose -f docker-compose.yml run backend pip install --no-cache-dir -r /app/requirements.txt

    - name: Run Django migrations
      run: |
        docker-compose -f docker-compose.yml run backend python manage.py migrate

    - name: Run Django tests
      run: |
        docker-compose -f docker-compose.yml run backend python manage.py test

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      env:
        SERVER_IP: 91.107.134.107

    - name: Deploy to server
      run: |
        ssh root@$SERVER_IP << 'EOF'
          cd /var/hotelscript-v2
          git pull origin main
          docker-compose down
          docker-compose up -d --build
        EOF
      env:
        SERVER_IP: 91.107.134.107