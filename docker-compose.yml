version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    command: bash /app/start.sh
    volumes:
      - /var/hotelscript-v2/media:/app/media
      - /var/hotelscript-v2/staticfiles:/app/staticfiles
      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-t&tg@de!xd4nbb1ci4(hl9#msk=3=^_^w0h((@m1&k=k8axhnu"  
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/sf24_9xkLp7"
      ALLOWED_HOSTS: "localhost,127.0.0.1,safarnameh24.com,www.safarnameh24.com,cps.safarnameh24.com,www.cps.safarnameh24.com,chatbot.safarname24.com,www.chatbot.safarnameh24.com, 91.107.140.82"
      CSRF_TRUSTED_ORIGINS: "http://safarnameh24.com,https://safarnameh24.com,http://www.safarnameh24.com,https://www.safarnameh24.com,http://cps.safarnameh24.com,https://cps.safarnameh24.com, http://chatbot.safarnameh24.com,https://chatbot.safarnameh24.com,http://www.chatbot.safarnameh24.com,https://www.chatbot.safarnameh24.com"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  channels_worker:
    build: .
    container_name: channels_worker
    command: python manage.py runworker default
    volumes:
      - /var/hotelscript-v2/media:/app/media
      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secure-secret-key-here"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/sf24_9xkLp7"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  bot:
    build: .
    container_name: telegram_bot
    command: python hotel_bot/bot.py
    volumes:
      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
      - /var/lib/backsafarname/alirezaazarakhsh20_gmail.com:/var/lib/backsafarname/alirezaazarakhsh20_gmail.com
      - /var/hotelscript-v2/media:/app/media
      - ./hotel_bot/.env:/app/hotel_bot/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      ENV_PATH: "/app/hotel_bot/.env"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/sf24_9xkLp7"
      PROJECT_DIR: "/app"
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: postgres:15.2
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /var/lib/backsafarname/alirezaazarakhsh20_gmail.com:/var/lib/backsafarname/alirezaazarakhsh20_gmail.com
    environment:
      POSTGRES_DB: "safarname24"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "alirezaazarakhsh20@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    volumes:
      - /var/lib/backsafarname/alirezaazarakhsh20_gmail.com:/var/lib/pgadmin/storage
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  celery:
    build: .
    container_name: celery_worker
    command: celery -A safarname24 worker -l info
    volumes:
      - /var/hotelscript-v2/media:/app/media
      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secure-secret-key-here"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/sf24_9xkLp7"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    networks:
      - app_network

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A safarname24 beat -l info
    volumes:
      - /var/hotelscript-v2/media:/app/media
      - /var/backups/sf24_9xkLp7:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secure-secret-key-here"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      MEDIA_ROOT: "/app/media"
      MEDIA_BACKUP_DIR: "/var/backups/sf24_9xkLp7"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
      - celery
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  backups:
    driver: local
  db_backups:
    driver: local
  staticfiles:
    driver: local

networks:
  app_network:
    driver: bridge