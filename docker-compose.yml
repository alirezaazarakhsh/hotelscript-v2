version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    command: bash /app/start.sh && python /app/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_storage:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./safarname24/.env
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: postgres:15.2
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "alirezaazarakhsh20@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    volumes:
      - /var/lib/backsafarname:/var/lib/pgadmin/storage
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

volumes:
  postgres_data:
  media_storage:

networks:
  app_network:
    driver: bridge
