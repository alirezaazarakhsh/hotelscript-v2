version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    command: bash /app/start.sh && python /app/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_storage:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-t&tg@de!xd4nbb1ci4(hl9#msk=3=^_^w0h((@m1&k=k8axhnu"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1,safarnameh24.com,www.safarnameh24.com,cps.safarnameh24.com,www.cps.safarnameh24.com,91.107.134.107"
      CSRF_TRUSTED_ORIGINS: "http://safarnameh24.com,https://safarnameh24.com,http://www.safarnameh24.com,https://www.safarnameh24.com,http://cps.safarnameh24.com,https://cps.safarnameh24.com"
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: postgres:13
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "safarname24"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
    networks:
