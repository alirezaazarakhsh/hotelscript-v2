name: CI/CD Backend Deploy - Hotel Script V1 Z

on:
  push:
    branches:
      - hotel-scriptv1-z

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-scriptv1-z-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Second Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_HOTEL_SCRIPTV1_Z }}
          SERVER_IP: ${{ secrets.SERVER_IP_HOTEL_SCRIPTV1_Z }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Validate required secrets without printing their values.
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::SSH_PRIVATE_KEY_HOTEL_SCRIPTV1_Z is missing."
            exit 1
          fi

          if [[ -z "${SERVER_IP:-}" ]]; then
            echo "::error::SERVER_IP_HOTEL_SCRIPTV1_Z is missing."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"

          # Save the private key.
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          # Validate that the private key is readable and valid.
          if ! ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null; then
            echo "::error::The SSH private key is invalid or has an unsupported format."
            exit 1
          fi

          # Verify the server host key before trusting it.
          SCAN_FILE="$(mktemp)"
          trap 'rm -f "$SCAN_FILE"' EXIT

          if ! ssh-keyscan -T 10 -p 22 -t ed25519 -H "$SERVER_IP" \
            > "$SCAN_FILE" 2>/dev/null; then
            echo "::error::Could not retrieve the server SSH host key on port 22."
            echo "Check SERVER_IP, port 22, server SSH service, and network firewall rules."
            exit 1
          fi

          if [[ ! -s "$SCAN_FILE" ]]; then
            echo "::error::ssh-keyscan returned no host keys."
            exit 1
          fi

          cat "$SCAN_FILE" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH key and host key configured successfully."

      - name: Test SSH connection
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_HOTEL_SCRIPTV1_Z }}
          SERVER_USER: ${{ secrets.SERVER_USER_HOTEL_SCRIPTV1_Z }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${SERVER_USER:-}" ]]; then
            echo "::error::SERVER_USER_HOTEL_SCRIPTV1_Z is missing."
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_IP" \
            'echo "SSH connection successful"; hostname'

      - name: Deploy to Second Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP_HOTEL_SCRIPTV1_Z }}
          SERVER_USER: ${{ secrets.SERVER_USER_HOTEL_SCRIPTV1_Z }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_IP" 'bash -se' <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          PROJECT_DIR="/var/hotelscript-v2"
          BRANCH="hotel-scriptv1-z"

          echo "Starting deployment..."
          echo "Server: $(hostname)"
          echo "Branch: $BRANCH"

          cd "$PROJECT_DIR"

          # Ensure this is the expected Git repository.
          git rev-parse --is-inside-work-tree > /dev/null

          echo "Fetching latest branch..."
          git fetch origin "$BRANCH"

          echo "Checking out deployment branch..."
          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH" --track "origin/$BRANCH"
          fi

          echo "Updating code..."
          git pull --ff-only origin "$BRANCH"

          echo "Checking Docker Compose configuration..."
          docker compose config -q

          echo "Rebuilding and starting containers..."
          docker compose up -d --build --remove-orphans

          echo "Container status:"
          docker compose ps

          echo "Deployment completed successfully at $(date)"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa"
