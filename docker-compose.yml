version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    command: bash /app/start.sh
    volumes:
      - .:/app
      - media_data:/app/media
      - backups:/var/backups/sf24_9xkLp7
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-t&tg@de!xd4nbb1ci4(hl9#msk=3=^_^w0h((@m1&k=k8axhnu"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1,safarnameh24.com,www.safarnameh24.com,cps.safarnameh24.com,www.cps.safarnameh24.com,91.107.134.107"
      CSRF_TRUSTED_ORIGINS: "http://safarnameh24.com,https://safarnameh24.com,http://www.safarnameh24.com,https://www.safarnameh24.com,http://cps.safarnameh24.com,https://cps.safarnameh24.com"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - app_network

  bot:
     build: .
  container_name: telegram_bot
  command: bash /app/backup.sh   # <-- مسیر درست
  volumes:
    - .:/app
    - backups:/app/backups       # مسیر داخلی کانتینر همسان با بکاپ
    - media_data:/app/media
  environment:
    BOT_TOKEN: "8454101111:AAFKanZZbaCRuPYb2YwFMWmn1kRed9ClzU0"
    ALLOWED_USERS: "5839876171,341564725"
    PROJECT_DIR: "/app"
    BACKUP_DIR: "/app/backups"   # مسیر داخلی کانتینر
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: admin
    DB_NAME: safarname24
  depends_on:
    - db
  networks:
    - app_network
    

  db:
    image: postgres:15.2
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "safarname24"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "alirezaazarakhsh20@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
    volumes:
      - /var/lib/backsafarname:/var/lib/pgadmin/storage
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  celery:
    build: .
    container_name: celery_worker
    command: celery -A safarname24 worker -l info
    volumes:
      - .:/app
      - media_data:/app/media
      - backups:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-t&tg@de!xd4nbb1ci4(hl9#msk=3=^_^w0h((@m1&k=k8axhnu"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - app_network

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A safarname24 beat -l info
    volumes:
      - .:/app
      - media_data:/app/media
      - backups:/var/backups/sf24_9xkLp7
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "django-insecure-t&tg@de!xd4nbb1ci4(hl9#msk=3=^_^w0h((@m1&k=k8axhnu"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "safarname24"
      DB_USER: "postgres"
      DB_PASSWORD: "admin"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
      - celery
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  backups:
    driver: local

networks:
  app_network:
    driver: bridge